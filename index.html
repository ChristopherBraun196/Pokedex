<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="icon" type="image/x-icon" href="./img/icons/Pokeball.svg" />
    <link rel="stylesheet" href="./styles/build.css" />

    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/pokemon.css" />
    <link rel="stylesheet" href="./styles/pokemonTypes.css" />
    <link rel="stylesheet" href="./styles/BigPokedexCard.css" />
  </head>
  <body>
    <div class="Background"></div>
    <header>
      <div class="HeaderBar">
        <div class="logo-container">
          <a href="#">
            <img src="./img/icons/pokeball.png" alt="Pokeball" />
          </a>
          <h1>Pokédex</h1>
        </div>
        <nav class="SearchBar" tabindex="0" aria-label="searchBar">
          <input
            data-i18n-placeholder="search-placeholder"
            data-id="search-input"
            id="search"
            type="text"
            placeholder="Search.."
          />
          <button
            data-i18n="search-button"
            data-id="search-button"
            aria-label="Search Pokémon"
            disabled
          >
            Search
          </button>
          <button
            data-i18n="theme-toggle"
            id="themeToggleBtn"
            aria-label="Switch to dark mode"
          >
            Dark
          </button>
          <div id="languageSwitch">
            <button
              class="languageBtn"
              data-lang="en"
              aria-label="Switch to English"
            >
              EN
            </button>
            <button
              class="languageBtn"
              data-lang="de"
              aria-label="Auf Deutsch umschalten"
            >
              DE
            </button>
          </div>
        </nav>
      </div>
    </header>
    <main data-id="content">
      <nav id="regionNav" aria-label="Region"></nav>

      <div class="menu-bars">
        <button
          data-i18n="show-all"
          id="showAllBtn"
          aria-label="Show all Pokémon"
        >
          All
        </button>
        <button
          data-i18n="show-favorites"
          id="showFavoritesBtn"
          aria-label="Show favorite Pokémon"
        >
          Favorites
        </button>
      </div>
      <div class="OverlayContainer" id="loadPokemon"></div>
      <div class="moreButton">
        <div id="loading-spinner" class="hidden">
          <div class="spinner"></div>
        </div>
        <p data-i18n="load-error" id="loadError" class="hidden">
          Could not load Pokémon. Please check your connection and try again.
        </p>
        <button
          data-i18n="reset-search"
          id="resetSearchBtn"
          class="hidden resetBtn"
          aria-label="Reset search"
        >
          Reset
        </button>

        <button
          data-i18n="load-more"
          data-id="load-more-button"
          aria-label="Load more Pokémon"
          id="loadMoreBtn"
          class="NoPush loadMoreBtn"
        >
          LoadMore...
        </button>
      </div>
    </main>

    <dialog
      data-id="dialog"
      aria-label="Pokémon details"
      class="dialogPosition example-dialog"
      id="openPokemonDialog"
    ></dialog>

    <footer>
      <div class="FooterLinks">
        <span>Created by Christopher Braun</span>
      </div>
      <div class="FooterLinks">
        <span>2026</span>
      </div>
    </footer>
    <script src="./js/main.js" type="module"></script>
  </body>
</html>
