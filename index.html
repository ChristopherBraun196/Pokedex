<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="icon" type="image/png" href="./assets/img/pokeball.png" />
    <link rel="stylesheet" href="./styles/build.css" />
  </head>
  <body>
    <div class="Background"></div>
    <div class="top-bar">
      <header class="header">
        <div class="header__inner">
          <div class="header__brand">
            <span class="header__lens" aria-hidden="true"></span>
            <span class="header__lights" aria-hidden="true">
              <span class="header__light header__light--red"></span>
              <span class="header__light header__light--yellow"></span>
              <span class="header__light header__light--green"></span>
            </span>
            <h1 class="header__title">Pokédex</h1>
          </div>

          <div class="header__actions">
            <div class="search" role="search">
              <input
                class="search__input"
                data-i18n-placeholder="search-placeholder"
                data-id="search-input"
                id="search"
                type="search"
                placeholder="Search.."
                aria-label="Search Pokémon"
              />
              <button
                class="search__button"
                data-id="search-button"
                aria-label="Search Pokémon"
                disabled
              >
                <svg
                  class="search__icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="7" />
                  <path d="M20 20l-3.5-3.5" />
                </svg>
              </button>
            </div>

            <div
              class="switch"
              id="languageSwitch"
              role="group"
              aria-label="Language"
            >
              <button
                class="switch__button"
                data-lang="en"
                aria-label="Switch to English"
              >
                EN
              </button>
              <button
                class="switch__button"
                data-lang="de"
                aria-label="Auf Deutsch umschalten"
              >
                DE
              </button>
            </div>

            <button
              class="theme-toggle"
              id="themeToggleBtn"
              aria-label="Switch to dark mode"
            >
              <svg
                class="theme-toggle__icon theme-toggle__icon--moon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
              </svg>
              <svg
                class="theme-toggle__icon theme-toggle__icon--sun"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                />
              </svg>
            </button>
          </div>
        </div>
      </header>
      <div class="toolbar">
        <div class="toolbar__inner">
          <div class="regions">
            <button
              class="regions__toggle"
              id="regionToggle"
              aria-expanded="false"
              aria-controls="regionNav"
            >
              <span class="regions__label">Region</span>
              <span class="regions__current" id="regionCurrent">Kanto</span>
              <svg
                class="regions__chevron"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <nav class="regions__list" id="regionNav" aria-label="Region"></nav>
          </div>

          <div class="switch switch--light" role="group" aria-label="View">
            <button
              class="switch__button"
              data-i18n="show-all"
              id="showAllBtn"
              aria-pressed="true"
              aria-label="Show all Pokémon"
            >
              All
            </button>
            <button
              class="switch__button"
              id="showFavoritesBtn"
              aria-pressed="false"
              aria-label="Show favorite Pokémon"
            >
              <svg class="switch__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"
                />
              </svg>
              <span data-i18n="show-favorites">Favorites</span>
              <span id="favoriteCount">0</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <main data-id="content">
      <ul class="card-list" id="loadPokemon"></ul>
      <p
        class="card-list__empty hidden"
        id="notFound"
        data-id="not-found"
        aria-live="polite"
      ></p>

      <div class="list-actions">
        <div class="list-actions__slot">
          <div
            class="list-actions__spinner hidden"
            id="loading-spinner"
            role="status"
            aria-label="Loading"
          ></div>
        </div>
        <p
          class="list-actions__error hidden"
          data-i18n="load-error"
          id="loadError"
        >
          Could not load Pokémon. Please check your connection and try again.
        </p>
        <button
          class="list-actions__button list-actions__button--secondary hidden"
          data-i18n="reset-search"
          id="resetSearchBtn"
          aria-label="Reset search"
        >
          Reset
        </button>
        <button
          class="list-actions__button"
          data-i18n="load-more"
          data-id="load-more-button"
          id="loadMoreBtn"
          aria-label="Load more Pokémon"
        >
          Load more
        </button>
      </div>
    </main>

    <dialog
      data-id="dialog"
      aria-label="Pokémon details"
      class="detail"
      id="openPokemonDialog"
    ></dialog>

    <footer class="footer">
      <div class="footer__inner">
        <span class="footer__credit" data-i18n="footer-created"
          >Created by Christopher Braun · 2026</span
        >
        <nav class="footer__links" aria-label="Legal">
          <a
            class="footer__link"
            href="https://christopher-braun-dev.de/impressum.html"
            data-i18n="footer-imprint"
            >Imprint</a
          >
          <a
            class="footer__link"
            href="https://christopher-braun-dev.de/datenschutz.html"
            data-i18n="footer-privacy"
            >Privacy</a
          >
        </nav>
        <span class="footer__source">
          <span data-i18n="footer-source">Data from</span>
          <a
            class="footer__link footer__link--accent"
            href="https://pokeapi.co"
            target="_blank"
            rel="noopener"
            >PokéAPI</a
          >
        </span>
      </div>
    </footer>

    <script src="./js/main.js" type="module"></script>
  </body>
</html>
