<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="icon" type="image/x-icon" href="./img/icons/Pokeball.svg" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/pokemon.css" />
    <link rel="stylesheet" href="./styles/pokemonTypes.css" />
    <link rel="stylesheet" href="./styles/BigPokedexCard.css" />
  </head>
  <body>
    <div class="Background"></div>
    <header>
      <div class="HeaderBar">
        <div class="logo-container">
          <a href="#">
            <img src="./img/icons/pokeball.png" alt="Pokeball" />
          </a>
          <h1>Pokédex</h1>
        </div>
        <nav class="SearchBar" tabindex="0" aria-label="searchBar">
          <input
            data-id="search-input"
            id="search"
            type="text"
            placeholder="Search.."
          />
          <button data-id="search-button" aria-label="Search Pokémon" disabled>
            Search
          </button>
          <button id="themeToggleBtn" aria-label="Switch to dark mode">
            Dark
          </button>
        </nav>
      </div>
    </header>
    <main data-id="content">
      <div class="menu-bars">
        <button id="showAllBtn" aria-label="Show all Pokémon">All</button>
        <button id="showFavoritesBtn" aria-label="Show favorite Pokémon">
          Favorites
        </button>
      </div>
      <div class="OverlayContainer" id="loadPokemon"></div>
      <div class="moreButton">
        <div id="loading-spinner" class="hidden">
          <div class="spinner"></div>
        </div>
        <p id="loadError" class="hidden">
          Could not load Pokémon. Please check your connection and try again.
        </p>
        <button
          id="resetSearchBtn"
          class="hidden resetBtn"
          aria-label="Reset search"
        >
          Reset
        </button>

        <button
          data-id="load-more-button"
          aria-label="Load more Pokémon"
          id="loadMoreBtn"
          class="NoPush loadMoreBtn"
        >
          LoadMore...
        </button>
      </div>
    </main>

    <dialog
      data-id="dialog"
      aria-label="Pokémon details"
      class="dialogPosition example-dialog"
      id="openPokemonDialog"
    ></dialog>

    <footer>
      <div class="FooterLinks">
        <span>Created by Christopher Braun</span>
      </div>
      <div class="FooterLinks">
        <span>2026</span>
      </div>
    </footer>
    <script src="./js/main.js" type="module"></script>
  </body>
</html>
